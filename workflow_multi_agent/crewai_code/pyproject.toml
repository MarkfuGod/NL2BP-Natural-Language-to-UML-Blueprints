[project]
name = "agileworkflow"
version = "0.2.0"
description = "NL2BP: natural-language requirements to UML (PlantUML) blueprints with CrewAI multi-agent and single-agent workflows"
readme = "README_EN.md"
license = "MIT"
authors = [{ name = "MarkfuGod" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,anthropic]>=1.15,<2",
]

[project.optional-dependencies]
# Route any model string through LiteLLM (providers CrewAI has no native client for).
litellm = ["crewai[litellm]>=1.15,<2"]

[project.scripts]
kickoff = "agileworkflow.main:kickoff"
run_crew = "agileworkflow.main:kickoff"
plot = "agileworkflow.main:plot"
nl2bp = "agileworkflow.main:cli"
nl2bp-multi = "agileworkflow.main:kickoff"
nl2bp-single = "agileworkflow.main:single_agent"
nl2bp-render = "agileworkflow.main:render"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agileworkflow"]

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
